{% extends "layouts/auth.html" %}
{% block title %}账号安全 · YuMi{% endblock %}
{% block heading %}账号安全{% endblock %}
{% block content %}
{# 该页继承登录布局，本身没有后台导航；正常已登录时给一个明确的出口，否则只能靠浏览器后退键离开。强制改密走的是 auth/change_password.html，不经过这里，门禁不受影响。 #}
<p><a href="/employee/admin">返回工作台</a></p>
<h2>修改密码</h2>
<form method="post" action="/employee/account/password">
  <input type="hidden" name="csrf_token" value="{{ password_csrf_token }}">
  <label for="current_password">当前密码<input id="current_password" name="current_password" type="password" maxlength="128" autocomplete="current-password" required></label>
  <label for="new_password">新密码<input id="new_password" name="new_password" type="password" maxlength="128" autocomplete="new-password" required></label>
  <button type="submit">修改密码</button>
</form>
<h2>会话管理</h2>
<form method="post" action="/employee/account/revoke-sessions">
  <input type="hidden" name="csrf_token" value="{{ revoke_csrf_token }}">
  <label for="revoke_password">当前密码<input id="revoke_password" name="password" type="password" maxlength="128" autocomplete="current-password" required></label>
  <button type="submit">撤销其他会话</button>
</form>
<form method="post" action="/employee/logout">
  <input type="hidden" name="csrf_token" value="{{ logout_csrf_token }}">
  <button class="button button--secondary" type="submit">退出登录</button>
</form>
{% endblock %}
