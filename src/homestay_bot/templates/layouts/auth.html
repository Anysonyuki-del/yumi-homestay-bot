<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>{% block title %}YuMi 管理后台{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css?v={{ app_version }}">
  </head>
  <body>
    <main class="card">
      <header class="page-header">
        <span class="brand__mark" aria-hidden="true">Y</span>
        <p class="eyebrow">YuMi 管理后台</p>
        <h1>{% block heading %}管理员验证{% endblock %}</h1>
      </header>
      {% if error %}<div class="alert alert--danger" role="alert">{{ error }}</div>{% endif %}
      {% if notice %}<div class="alert alert--success" role="status">{{ notice }}</div>{% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
