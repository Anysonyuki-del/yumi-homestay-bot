<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>客户管理</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <main class="card">
      <header class="page-header">
        <p class="eyebrow">YuMi 客户 CRM</p>
        <h1>客户管理</h1>
      </header>

      <form class="search-form" method="get" action="/employee/customers">
        <label>
          搜索姓名或员工备注
          <input type="search" name="query" value="{{ query }}" maxlength="100" placeholder="输入关键词">
        </label>
        <button type="submit">搜索</button>
      </form>

      <ul class="task-list">
        {% for customer in customers %}
        <li>
          <a class="task-row" href="/employee/customers/{{ customer.id }}">
            <span>
              <strong>{{ customer.display_name }}</strong>
              <small>{{ customer.masked_phone }}{% if customer.note %} · {{ customer.note }}{% endif %}</small>
            </span>
            <span class="status-badge">查看</span>
          </a>
        </li>
        {% else %}
        <li class="empty-state">没有找到客户。</li>
        {% endfor %}
      </ul>
      <nav aria-label="客户分页">
        {% if previous_url %}<a href="{{ previous_url }}">上一页</a>{% endif %}
        {% if next_url %}<a href="{{ next_url }}">下一页</a>{% endif %}
      </nav>
    </main>
  </body>
</html>
