<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ property.title }} · 房源配置</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <main class="card">
      <a class="back-link" href="/employee/properties">← 返回房源列表</a>
      <header class="page-header">
        <p class="eyebrow">百居易房间 #{{ property.id }}</p>
        <h1>{{ property.title }}</h1>
      </header>

      <section class="action-panel">
        <h2>房源资料</h2>
        <form method="post" action="/employee/properties/{{ property.id }}/profile">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <label>房源名称<input name="title" value="{{ property.title }}" maxlength="128" required></label>
          <label>房型<input name="room_type" value="{{ property.room_type or '' }}" maxlength="128"></label>
          <label>区域<input name="district" value="{{ property.district or '' }}" maxlength="64"></label>
          <label>地址提示<textarea name="address_hint" maxlength="2000">{{ property.address_hint or "" }}</textarea></label>
          <label>停车说明<textarea name="parking_instructions" maxlength="4000">{{ property.parking_instructions or "" }}</textarea></label>
          <label><input type="checkbox" name="is_active" value="true" {% if property.is_active %}checked{% endif %}> 启用该房源</label>
          <button type="submit">保存房源资料</button>
        </form>
      </section>

      <section class="action-panel">
        <h2>入住凭证</h2>
        {% if credential %}
        <p>当前凭证版本 {{ credential.version }}，密码和入住指南不会在页面回显。</p>
        <a href="/employee/properties/{{ property.id }}/qr" target="_blank" rel="noopener">查看当前二维码</a>
        {% else %}
        <p>尚未配置入住凭证。</p>
        {% endif %}
        <form method="post" enctype="multipart/form-data" action="/employee/properties/{{ property.id }}/credentials">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <label>新门锁密码<input type="password" name="password" maxlength="128" autocomplete="new-password" required></label>
          <label>新入住指南<textarea name="guide" maxlength="10000" required></textarea></label>
          <label>新入住二维码<input type="file" name="qr_image" accept="image/png,image/jpeg,image/webp" required></label>
          <p>提交后创建新版本并停用旧版本；请完整填写以上三项。</p>
          <button type="submit">替换入住凭证</button>
        </form>
      </section>
    </main>
  </body>
</html>
