name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  RUN_LIVE_CONTRACT_TESTS: "0"

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      # 仅供清理与行锁回归使用的隔离库；凭据为合成值，与生产角色无关。
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yumi_test
          POSTGRES_PASSWORD: yumi-test-only
          POSTGRES_DB: yumi_test_retention
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yumi_test -d yumi_test_retention"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 配置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: 安装依赖
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-build-isolation ".[dev]"

      - name: 安装浏览器运行时
        run: python -m playwright install --with-deps chromium

      - name: 静态检查
        run: |
          python -m ruff check .
          python -m mypy

      - name: 全新数据库迁移
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-alembic.sqlite3
        run: python -m alembic upgrade head

      - name: 无外联测试
        run: python -m pytest -q

      - name: 隔离 PostgreSQL 迁移
        env:
          DATABASE_URL: postgresql+asyncpg://yumi_test:yumi-test-only@127.0.0.1:5432/yumi_test_retention
        run: python -m alembic upgrade head

      - name: 隔离 PostgreSQL 回归
        env:
          YUMI_TEST_POSTGRES_URL: postgresql+asyncpg://yumi_test:yumi-test-only@127.0.0.1:5432/yumi_test_retention
        # 先确认变量存在，避免用例因缺变量全部跳过却被当成通过。
        run: |
          python -c 'import os; assert os.environ.get("YUMI_TEST_POSTGRES_URL"), "需要隔离 PostgreSQL 测试库"'
          python -m pytest -q -rs tests/integration/test_retention_postgresql.py

      - name: 构建生产镜像
        run: docker build --tag yumi-homestay-bot:ci .
